services:
  postgres:
    image: postgres:16-alpine
    container_name: engitrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engitrace_db}
      POSTGRES_USER: ${POSTGRES_USER:-engitrace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engitrace_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - engitrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engitrace_user} -d ${POSTGRES_DB:-engitrace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - engitrace-network

volumes:
  engitrace_pgdata:
    name: engitrace_pgdata

networks:
  engitrace-network:
    name: engitrace-network
    driver: bridge
